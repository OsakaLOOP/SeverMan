services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: sm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置本地数据库管理密码}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 768m
    cpus: 1.5
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=2MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sm"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 20s

volumes:
  postgres_data:
